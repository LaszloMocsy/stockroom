name: CI

# Pull requests cover feature branches; pushes are only built on main, so a
# branch with an open PR does not run the same checks twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR (or per branch for main and manual runs): a new push
  # cancels that PR's previous run.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    # Lightweight single-CPU runner; enough for formatting. Jobs that need
    # Docker (Testcontainers) should pin a full VM image such as ubuntu-26.04.
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

  api-client:
    name: API client
    # Builds the TypeScript client from the committed OpenAPI snapshot
    # (server/openapi/openapi.v1.json). The server job fails if the snapshot
    # is stale; this job fails if the snapshot drops or changes something
    # the client uses, because the client's types no longer compile.
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type-checks the sources and the tests against the generated types.
      - run: pnpm --filter api-client typecheck

      - run: pnpm --filter api-client test

      - run: pnpm --filter api-client build

  server:
    name: .NET build and test
    # A full VM: the integration tests start PostgreSQL in Docker through
    # Testcontainers, and ubuntu-slim has no Docker.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      # Installs the SDK pinned in global.json.
      - uses: actions/setup-dotnet@v6

      # setup-dotnet's own cache needs packages.lock.json files, which the
      # projects do not use, so cache the NuGet folder keyed on the project files.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj', 'server/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      # Warnings, including code-style violations, fail the build
      # (Directory.Build.props).
      - run: dotnet build --no-restore --configuration Release

      # Docker Hub rate-limits pulls from shared runner IPs (429 Too Many
      # Requests). Pull the official image from the AWS ECR Public mirror and
      # tag it, so Testcontainers finds it locally and does not pull. Keep the
      # tag in sync with PostgresFixture.Image.
      - name: Pull PostgreSQL image
        run: |
          docker pull public.ecr.aws/docker/library/postgres:17
          docker tag public.ecr.aws/docker/library/postgres:17 postgres:17

      - run: dotnet test --no-build --configuration Release
