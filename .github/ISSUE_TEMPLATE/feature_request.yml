name: Feature request
description: Suggest a new feature or a change in behaviour.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, please check whether it is already covered, or deliberately out of scope, in [SPECIFICATION.md](https://github.com/LaszloMocsy/stockroom/blob/main/SPECIFICATION.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have thought about.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the specification and existing issues for this request.
          required: true
