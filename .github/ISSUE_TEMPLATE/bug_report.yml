name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do **not** use this form for security vulnerabilities; see [SECURITY.md](https://github.com/LaszloMocsy/stockroom/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Scan …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages, screenshots, or logs if you have them.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API / server
        - Mobile app
        - Web app
        - Deployment (Docker, compose, hosting)
        - Documentation
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Server version (from `/api/v1/info`), app version, or commit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, device, browser, or hosting setup, as relevant.
